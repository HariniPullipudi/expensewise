<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ExpenseWise</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <a href="/" style="display: flex; flex-direction: column; align-items: center; text-decoration: none;">
        <div class="brand-logo" style="width: 48px; height: 48px; font-size: 1.5rem; margin-bottom: 0.75rem;">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <span class="brand-text" style="color: #0f172a; font-size: 1.5rem;">ExpenseWise</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">
        Sign in to your personal expense dashboard
      </p>
    </div>

    <!-- Demo helper banner for viva evaluation -->
    <div style="background: #eef2ff; border: 1px dashed #818cf8; border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 0.8rem; color: #4338ca;">
        <strong>Quick Viva Demo?</strong> Click to auto-fill sample credentials.
      </div>
      <button type="button" id="fill-demo-btn" class="btn btn-outline btn-sm" style="background: #ffffff; border-color: #c7d2fe; color: #4338ca;">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Auto Fill
      </button>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <i class="fa-regular fa-envelope input-icon-left"></i>
          <input
            type="email"
            id="email"
            class="form-control has-icon-left"
            placeholder="name@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon-left"></i>
          <input
            type="password"
            id="password"
            class="form-control has-icon-left"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
          <button type="button" class="input-icon-right toggle-password" data-target="password" title="Show / Hide Password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">
          <input type="checkbox" id="rememberMe" style="accent-color: var(--primary);" />
          Remember me for 30 days
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account yet?
      <a href="/register.html" style="font-weight: 600;">Create an account</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
