<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ExpenseWise</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <a href="/" style="display: flex; flex-direction: column; align-items: center; text-decoration: none;">
        <div class="brand-logo" style="width: 48px; height: 48px; font-size: 1.5rem; margin-bottom: 0.75rem;">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <span class="brand-text" style="color: #0f172a; font-size: 1.5rem;">ExpenseWise</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">
        Start managing your income and expenses today
      </p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <div class="input-group">
          <i class="fa-regular fa-user input-icon-left"></i>
          <input
            type="text"
            id="name"
            class="form-control has-icon-left"
            placeholder="John Doe"
            required
            autocomplete="name"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <i class="fa-regular fa-envelope input-icon-left"></i>
          <input
            type="email"
            id="email"
            class="form-control has-icon-left"
            placeholder="name@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon-left"></i>
          <input
            type="password"
            id="password"
            class="form-control has-icon-left"
            placeholder="Minimum 6 characters"
            required
            autocomplete="new-password"
            minlength="6"
          />
          <button type="button" class="input-icon-right toggle-password" data-target="password" title="Show / Hide Password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <div class="input-group">
          <i class="fa-solid fa-check-double input-icon-left"></i>
          <input
            type="password"
            id="confirmPassword"
            class="form-control has-icon-left"
            placeholder="Re-enter password"
            required
            autocomplete="new-password"
            minlength="6"
          />
          <button type="button" class="input-icon-right toggle-password" data-target="confirmPassword" title="Show / Hide Password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div style="margin-bottom: 1.5rem; font-size: 0.82rem; color: var(--text-muted);">
        By registering, your records will be encrypted with bcrypt and stored in MongoDB with secure session isolation.
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        <span>Create Account</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
      Already have an account?
      <a href="/login.html" style="font-weight: 600;">Sign in here</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
